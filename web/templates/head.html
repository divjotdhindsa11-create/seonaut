{{ define "head" }}
<!DOCTYPE html>
<html lang="{{ .Lang }}">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="robots" content="noindex,nofollow">
	{{ if .Refresh }}
		<meta http-equiv="refresh" content="120"/>
	{{ end }}
	<title>
		{{ trans .PageTitle }} - SEOnaut
	</title>
	<link rel="stylesheet" href="/resources/style.css">
</head>
<body class="{{ .Theme }}{{ if (is_rtl .Lang) }} rtl{{ end }}">
<div id="main">
 <aside class="app-sidebar" aria-label="Main navigation">
  <a class="brand" href="/"><span class="brand-icon">S</span> SEOnaut <span class="brand-tag">STUDIO</span></a>
  <div class="nav-label">WORKSPACE</div>
  <nav class="app-nav">
   <a href="/" data-nav="projects"><span aria-hidden="true">▦</span> {{ trans "PROJECTS" }}</a>
   <a href="/overview" data-nav="overview"><span aria-hidden="true">◈</span> Overview</a>
   <a href="/account" data-nav="account"><span aria-hidden="true">⚙</span> {{ trans "ACCOUNT" }}</a>
  </nav>
  <div class="sidebar-foot"><span class="status-dot"></span> Private workspace<a href="/signout">{{ trans "LOGOUT" }} ↗</a></div>
 </aside>
 <header class="workspace-header"><span>Workspace <span class="breadcrumb-divider">/</span> {{ trans .PageTitle }}</span><span class="workspace-badge">SEO workspace</span><a class="mobile-signout" href="/signout">Log out ↗</a></header>
 <script>document.addEventListener('DOMContentLoaded',()=>{const p=location.pathname;document.querySelectorAll('[data-nav]').forEach(a=>{if((a.dataset.nav==='projects'&&p!=='/overview'&&p!=='/account')||a.getAttribute('href')===p){a.setAttribute('aria-current','page')}})})</script>
{{ end }}
