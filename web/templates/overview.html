<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>SEOnaut Overview</title>
<style>body{font:16px system-ui;background:#111821;color:#e9eff5;margin:auto;max-width:1150px;padding:24px}a{color:#89bdff}select{font:inherit;padding:12px;background:#222e3c;color:inherit;border:1px solid #53657a;border-radius:8px}main{display:grid;grid-template-columns:1fr 1fr;gap:16px}section{background:#1b2634;border:1px solid #3b4b60;border-radius:12px;padding:20px;min-width:0}h2{font-size:20px}p{color:#c1cddd;line-height:1.5}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px;text-align:left;border-bottom:1px solid #3b4b60}td:first-child{overflow-wrap:anywhere}small{color:#bdcbda}.wide{grid-column:1/-1}.scroll{overflow:auto}.kpis{display:flex;gap:20px;flex-wrap:wrap}.kpis b{display:block;font-size:27px}@media(max-width:650px){main{grid-template-columns:1fr}body{padding:16px}}</style>
<nav><a href="/">Projects and full crawl reports</a> · <a href="/account">Account</a></nav><h1>Your SEO overview</h1><select id="site" aria-label="Choose site"></select><p id="period"></p><main id="main"></main><p><small>Optional tools: <a href="https://ahrefs.com/webmaster-tools" rel="noreferrer">Ahrefs Webmaster Tools</a> · <a href="https://neilpatel.com/ubersuggest/" rel="noreferrer">Ubersuggest</a></small></p>
<script>
const snapshot={{.Snapshot}},projects={{.Projects}};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const table=(heads,rows)=>`<div class="scroll"><table><thead><tr>${heads.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const section=(h,b)=>`<section><h2>${esc(h)}</h2>${b}</section>`;
const num=x=>new Intl.NumberFormat('en-CA',{maximumFractionDigits:2}).format(x??0);
const gaTable=r=>r?.rows?.length?table([...(r.dimensionHeaders||[]),...(r.metricHeaders||[])].map(x=>x.name),r.rows.map(x=>[...(x.dimensionValues||[]),...(x.metricValues||[])].map(v=>v.value))):'<p>No data in this report period.</p>';
function render(){const s=snapshot.sites[document.querySelector('#site').value],g=s.gsc,ga=s.ga4.reports||[],t=g.totals?.[0];
const p=projects.find(p=>p.Project.URL.includes(s.domain));const c=p?.Crawl;
const crawl=c?.Id?`<p>${esc(c.TotalURLs)} URLs, ${esc(c.CriticalIssues)} critical, ${esc(c.AlertIssues)} high, ${esc(c.WarningIssues)} low issues.</p><a href="/dashboard?pid=${p.Project.Id}">Open crawl details</a>`:'<p>First crawl pending. Open Projects to run the site audit.</p>';
document.querySelector('#period').textContent=`Google reporting period: ${snapshot.start} to ${snapshot.end}. Snapshot refreshed ${snapshot.updated}. Top 50 search rows. Google data is a saved snapshot.`;
document.querySelector('#main').innerHTML=section('Site audit',crawl)+section('Search performance',t?`<div class="kpis">${[['Clicks',t.clicks],['Impressions',t.impressions],['CTR %',t.ctr*100],['Position',t.position]].map(([label,v])=>`<span>${esc(label)}<b>${num(v)}</b></span>`).join('')}</div>`:`<p>${esc(g.status)}</p>`)+section('Search queries',table(['Query','Clicks','Impressions','Position'],(g.queries||[]).map(x=>[x.keys[0],x.clicks,x.impressions,num(x.position)])))+section('Search pages',table(['Page','Clicks','Impressions'],(g.pages||[]).map(x=>[x.keys[0],x.clicks,x.impressions])))+section('Visitors and sessions',gaTable(ga[0]))+section('Traffic sources',gaTable(ga[2]))+section('Top pages',gaTable(ga[1]))+section('PageSpeed and Core Web Vitals',`<p>${esc(s.pagespeed.status)}</p>`)+section('Bing search and backlinks',`<p>${esc(s.bing.status)}</p>`)+section('Keyword suggestions',Array.isArray(s.suggestions)?`<p>Seed: ${esc(s.keyword)}</p><ul>${s.suggestions[1].map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:`<p>${esc(s.suggestions.error)}</p>`);
}
document.querySelector('#site').innerHTML=snapshot.sites.map((s,i)=>`<option value="${i}">${esc(s.name)}</option>`).join('');document.querySelector('#site').onchange=render;render();
</script></html>
